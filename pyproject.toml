[project]
name = "nemoscribe"
version = "0.5.0"
description = "Convert video files to SRT subtitles using NVIDIA NeMo ASR models with accurate timestamps"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.13,<2.14",
    "nemo_toolkit[asr]>=3.0,<3.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "onnx>=1.22,<1.23",
]

[project.optional-dependencies]
# ITN (Inverse Text Normalization) for converting spoken forms to written forms
# e.g., "twenty five dollars" -> "$25"
# Note: pynini dependency can be tricky to install on some systems
itn = ["nemo_text_processing>=1.2,<2"]
# Benchmark evaluation tools
benchmark = ["jiwer>=4,<5"]
# LLM post-processing for fixing transcription errors
llm = ["anthropic>=0.121,<1", "openai>=3,<4", "python-dotenv>=1.2.2,<2", "json-repair>=0.63,<1"]
# All optional features
all = ["nemo_text_processing>=1.2,<2", "jiwer>=4,<5", "anthropic>=0.121,<1", "openai>=3,<4", "python-dotenv>=1.2.2,<2", "json-repair>=0.63,<1"]


[project.scripts]
nemoscribe = "nemoscribe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["ruff==0.16.2"]

# Constrain NeMo-sensitive dependencies to the validated major/minor lines (see UPGRADE_NEMO.md)
[tool.uv]
constraint-dependencies = [
    "transformers>=5.15,<6",
    "numpy>=2.5,<3",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = []

[tool.ruff.lint.per-file-ignores]
# F401: imported but unused - intentional for availability checks
"tests/test_improvements.py" = ["F401"]
