name: Lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ruff:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Check lockfile
        run: uv lock --check

      - name: Run ruff
        run: uvx --from ruff==0.17.5 ruff check .
